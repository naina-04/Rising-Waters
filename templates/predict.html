<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Flood Risk | Rising Waters</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Rising Waters</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4 form-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h2 class="fw-bold text-dark">Meteorological Input</h2>
                            <p class="text-muted">Enter the current regional weather data to calculate flood risk.</p>
                        </div>
                        
                        <form action="/predict" method="POST" id="predictionForm" class="needs-validation" novalidate>
                            
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="annual_rainfall" class="form-label fw-semibold">Annual Rainfall (mm)</label>
                                    <input type="number" step="any" class="form-control form-control-lg" id="annual_rainfall" name="annual_rainfall" placeholder="e.g. 2100" required>
                                    <div class="invalid-feedback">Please provide annual rainfall.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="seasonal_rainfall" class="form-label fw-semibold">Seasonal Rainfall (mm)</label>
                                    <input type="number" step="any" class="form-control form-control-lg" id="seasonal_rainfall" name="seasonal_rainfall" placeholder="e.g. 1200" required>
                                    <div class="invalid-feedback">Please provide seasonal rainfall.</div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="temperature" class="form-label fw-semibold">Temperature (°C)</label>
                                    <input type="number" step="any" class="form-control form-control-lg" id="temperature" name="temperature" placeholder="e.g. 28.5" required>
                                    <div class="invalid-feedback">Please provide current temperature.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="humidity" class="form-label fw-semibold">Humidity (%)</label>
                                    <input type="number" step="any" class="form-control form-control-lg" id="humidity" name="humidity" placeholder="e.g. 75" required>
                                    <div class="invalid-feedback">Please provide humidity percentage.</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="cloud_visibility" class="form-label fw-semibold">Cloud Visibility Index</label>
                                    <input type="number" step="any" class="form-control form-control-lg" id="cloud_visibility" name="cloud_visibility" placeholder="e.g. 6.5" required>
                                    <div class="invalid-feedback">Please provide cloud visibility.</div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="monsoon_intensity" class="form-label fw-semibold">Monsoon Intensity (1-15)</label>
                                    <input type="range" class="form-range custom-range" min="1" max="15" step="1" id="monsoon_intensity" name="monsoon_intensity" value="5" oninput="this.nextElementSibling.value = this.value">
                                    <output class="fw-bold text-primary">5</output>
                                </div>
                            </div>

                            <div class="mt-5 text-center">
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 submit-btn" id="submitBtn">
                                    <span id="btnText">Calculate Flood Risk</span>
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none mx-2" role="status" aria-hidden="true"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
